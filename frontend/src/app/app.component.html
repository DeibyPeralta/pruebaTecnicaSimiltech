<main class="layout">
  <app-sidebar [activeView]="activeView" (viewSelected)="setView($event)" (logout)="logout()" />

  <section class="content">
    <header class="topbar">
      <div>
        <p class="section-name">Gestion de Parqueadero</p>
        <h1>{{ pageTitle }}</h1>
        <p class="muted">Resumen general de la actividad del parqueadero en tiempo real.</p>
      </div>

      <div class="user-card">
        <span class="bell">!</span>
        <span class="avatar">A</span>
        <strong>Administrador</strong>
      </div>
    </header>

    <section *ngIf="message" class="alert success">{{ message }}</section>
    <section *ngIf="error" class="alert error">{{ error }}</section>

    <app-dashboard
      *ngIf="activeView === 'dashboard'"
      [refreshKey]="refreshKey"
      (viewSelected)="setView($event)"
      (errorMessage)="showError($event)"
    />

    <app-ingresos
      *ngIf="activeView === 'ingresos'"
      (entryRegistered)="handleEntryRegistered($event)"
      (errorMessage)="showError($event)"
    />

    <app-salidas
      *ngIf="activeView === 'salidas'"
      [lastExit]="lastExit"
      (openExitModal)="openExitModal()"
    />

    <app-vehiculos
      *ngIf="activeView === 'vehiculos'"
      [refreshKey]="refreshKey"
      (exitRequested)="openExitModal($event)"
      (recordUpdated)="handleRecordUpdated($event)"
      (errorMessage)="showError($event)"
    />
  </section>

  <app-salida-modal
    [open]="showExitModal"
    [plate]="exitPlate"
    (closed)="closeExitModal()"
    (exitRegistered)="handleExitRegistered($event)"
    (errorMessage)="showError($event)"
  />
</main>
